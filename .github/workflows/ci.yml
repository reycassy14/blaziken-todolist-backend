name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, staging ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter (future)
        run: echo "Linting will be added next"
        continue-on-error: true

      - name: Run tests
        run: npm test
      
      - name: Build TypeScript
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-${{ github.sha }}
          path: dist/
          retention-days: 30
      
      - name: Verify build output
        run: |
          echo "✓ Build completed!"
          ls -la dist/
  
  Blaziken-ENV:
    runs-on: ubuntu-latest
    environment: Blaziken ENV
    env:
      MONGODB_URI: ${{ vars.MONGODB_URI }}
      MONGODB_NAME: ${{ vars.MONGODB_NAME }}

    steps:
      - name: env variables non sensitive
        run: |
         echo "value of mongodb_uri: $MONGODB_URI"
         echo  "value of mongodb_name: $MONGODB_NAME"
      
      - name: Debug available variables
        run: |
          echo "all env vars:"
          env | sort
