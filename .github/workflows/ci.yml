name: Backend CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Verify build output
        run: |
          echo "✓ Build completed successfully!"
          echo ""
          echo "Checking output directory structure..."
          ls -la dist/
          echo ""
          echo "Checking API folder..."
          ls -la dist/api/
          echo ""
          echo "✓ All JavaScript files generated successfully!"